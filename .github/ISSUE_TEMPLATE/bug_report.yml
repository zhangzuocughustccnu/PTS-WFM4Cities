name: Bug report
description: Report a reproducible WFM4Cities problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove sensitive or unpublished data before attaching files.
  - type: input
    id: version
    attributes:
      label: WFM4Cities version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command or shortest script and small input if possible.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and full error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
